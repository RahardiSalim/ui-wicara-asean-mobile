name: Build Wicara Mobile APK

# Manual runs produce a downloadable artifact; pushing a v* tag also publishes a
# public GitHub Release so anyone can install without a GitHub account.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  WICARA_API_BASE_URL: https://ui-wicara-asean-be.vercel.app

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned rather than tracking `stable`: an upstream Flutter release
          # should not be able to break a release build that changed nothing.
          flutter-version: '3.44.9'
          channel: 'stable'

      - name: Precache Flutter Android engine
        run: flutter precache --android

      - name: Resolve version
        id: version
        run: |
          # Tag pushes name the artifact after the tag; manual runs fall back to
          # the pubspec version so the file is still identifiable.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | cut -d+ -f1)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION"

      - name: Write local.properties
        run: |
          FLUTTER_SDK=$(dirname $(dirname $(which flutter)))
          echo "sdk.dir=$ANDROID_HOME"          > android/local.properties
          echo "flutter.sdk=$FLUTTER_SDK"       >> android/local.properties
          echo "flutter.buildMode=release"      >> android/local.properties

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.WICARA_KEYSTORE_BASE64 }}
        run: |
          # Without this the build falls back to the debug key, which CI
          # regenerates every run -- Android then refuses to install the update
          # over a previously sideloaded copy.
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::WICARA_KEYSTORE_BASE64 secret is not set."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/wicara-release.p12
          echo "Keystore written: $(wc -c < android/wicara-release.p12) bytes"

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK
        env:
          WICARA_KEYSTORE_PATH: wicara-release.p12
          WICARA_KEYSTORE_PASSWORD: ${{ secrets.WICARA_KEYSTORE_PASSWORD }}
          WICARA_KEY_ALIAS: wicara
          WICARA_KEY_PASSWORD: ${{ secrets.WICARA_KEYSTORE_PASSWORD }}
        run: |
          # Restricting to the two ARM targets drops the x86_64 Flutter engine,
          # which only emulators load, and takes the download from 117 MB to 91.
          flutter build apk --release \
            --target-platform android-arm,android-arm64 \
            --dart-define=WICARA_API_BASE_URL=${{ env.WICARA_API_BASE_URL }} \
            --build-name=${{ steps.version.outputs.version }} \
            --build-number=${{ github.run_number }}

      - name: Verify the APK is release-signed
        run: |
          # A debug-signed or v1-less APK installs fine on a modern phone and
          # fails on Android 6, so assert here rather than in a user's hands.
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --min-sdk-version 23 --print-certs \
            build/app/outputs/flutter-apk/app-release.apk

      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/wicara-${{ steps.version.outputs.version }}.apk

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wicara-mobile-apk
          path: build/app/outputs/flutter-apk/wicara-${{ steps.version.outputs.version }}.apk

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/wicara-${{ steps.version.outputs.version }}.apk
          generate_release_notes: true
          body: |
            ## Install Wicara di Android

            1. Download `wicara-${{ steps.version.outputs.version }}.apk` di bawah.
            2. Buka file-nya. Kalau Android nanya, izinkan **Install unknown apps**
               untuk browser/file manager yang kamu pakai.
            3. Tap **Install**.

            Butuh Android 6.0 (API 23) ke atas dan koneksi internet.
